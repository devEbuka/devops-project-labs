services:
  api:
    image: ${IMAGE_URI:?IMAGE_URI must be provided}
    ports:
      - "8000:8055"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
      INSTANCE_ID: ${INSTANCE_ID:-unknown}

  init:
    image: ${IMAGE_URI:?IMAGE_URI must be provided}
    command: ["python", "-m", "scripts.init_db"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided}
    profiles: ["setup"]